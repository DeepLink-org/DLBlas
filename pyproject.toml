[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlblas"
authors = [{name = "dlblas Team"}]
license = { "file"= "LICENSE" }
readme = "README.md"
description = "dlblas"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dynamic = [ "version", "dependencies", "optional-dependencies"]

[project.urls]
Homepage="https://github.com/DeepLink-org/DLBlas"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["benchmarks", "csrc", "examples"]
namespaces = false

[tool.pytest.ini_options]
# dlblas/kernels/cute_gemm is a vendored, self-contained project with its own
# pytest configuration and ~18k tests; run them from that directory. Keeping it
# out of the default recursion also avoids a collection error, because its
# conftest declares pytest_plugins, which pytest only allows in a top-level
# conftest. Default norecursedirs are repeated here because setting the option
# replaces pytest's defaults.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "dlblas/kernels/cute_gemm",
]
